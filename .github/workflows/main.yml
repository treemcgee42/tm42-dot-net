name: Generate and deploy site
on:
  push:
    branches:
      - main
  workflow_dispatch: 
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  gen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Make
        run: make all
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
